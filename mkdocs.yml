# Rendered documentation site over docs/ (Diátaxis + arc42-lite + MADR + Scoring Card).
# Serve locally:  python -m mkdocs serve -a 127.0.0.1:8001   (from shinehackathon/)
# The docs THEMSELVES are the source of truth in docs/ — this is only the renderer.
site_name: JSGP Eldercare Triage — Documentation
site_description: >-
  Decide-layer triage system for One Care caseworkers: deterministic two-track
  scoring (acute falls / chronic routine anomaly), explainable by contract.
docs_dir: docs
site_dir: .mkdocs-site
use_directory_urls: false

theme:
  name: material
  palette:
    scheme: default
    primary: deep orange   # Warm Human terracotta
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest

plugins:
  - search
  - roamlinks   # renders Obsidian [[wikilinks]] used throughout docs/

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: README.md
  - The Solution (judges start here):
      - Solution overview: solution-overview.md
      - Model card & datasheet: scoring-card.md
      - Hardware scan (sense layer): hardware-scan.md
      - Hardware bridge plan: hardware-bridge-plan.md
      - Slide plan: slide-plan.md
  - Engineering:
      - Backend architecture: backend-architecture.md
      - Feature specification: feature-spec.md
      - Demo runbook: demo-runbook.md
  - Decisions (ADRs):
      - Index: adr/README.md
      - 0001 Filesystem-first vault (internal tooling): adr/0001-filesystem-first-vault.md
      - 0002 Backend stack & scoring: adr/0002-backend-stack-and-scoring.md
      - 0003 Absolute-weight risk aggregation: adr/0003-absolute-weight-risk-aggregation.md
      - 0004 Contract parity guard: adr/0004-contract-parity-guard.md
      - 0005 Sensitivity-first operating point: adr/0005-sensitivity-first-operating-point.md
